services:
  postgres:
    image: postgres:16
    container_name: collab-pm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-collab_pm}
      POSTGRES_USER: ${POSTGRES_USER:-collab_pm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collab_pm_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: collab-pm-keycloak
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    command: start-dev --http-port=8081
    ports:
      - "8081:8081"
    depends_on:
      - postgres

volumes:
  postgres_data:
